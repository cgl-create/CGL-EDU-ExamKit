<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114"><title>CGL+ ExamKit</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#20232a;--line:#30343d;--text:#f4f4f2;--muted:#9da3ad;--yellow:#f2c94c;--red:#f07178;--green:#65c995;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#15171b;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.mark{width:38px;height:38px;border-radius:12px;background:var(--yellow);color:#161616;display:grid;place-items:center;font-weight:900}.brand strong{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b7bbc3;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#292b30;color:white}.nav button.active:before{content:"";width:3px;height:18px;background:var(--yellow);border-radius:4px;margin-left:-12px;margin-right:9px}.nav .ico{width:18px;text-align:center;color:var(--yellow)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;padding:8px}.main{min-width:0}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:18px}.crumb{color:var(--muted);font-size:13px}.topright{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#343740;color:var(--yellow);font-weight:700}.content{padding:32px 36px;max-width:1400px;margin:auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px}.heading h1{font-size:27px;margin:0 0 5px}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:9px}.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#171717;font-weight:700}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.metric{font-size:28px;font-weight:750;margin-top:8px}.muted{color:var(--muted)}.section-title{font-size:16px;margin:0 0 14px}.panel{margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#111318;border:1px solid var(--line);border-radius:8px;padding:10px 11px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--yellow)}textarea{min-height:90px;resize:vertical}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:600}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#2b2d33;color:#cbd0d7}.empty{padding:35px;text-align:center;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.question{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.option{display:flex;gap:8px;align-items:center;margin:7px 0}.option input{width:auto}.toast{position:fixed;right:22px;bottom:22px;background:#272a31;border:1px solid var(--line);padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px #0008;z-index:10}.hidden{display:none!important}.sheet{background:#fff;color:#111;padding:22px;border-radius:6px;max-width:720px;margin:16px auto}.sheet h2,.sheet p{color:#111}.bubble{display:inline-block;border:1px solid #333;border-radius:50%;width:17px;height:17px;margin:0 4px;vertical-align:middle}
@media(max-width:900px){.app{grid-template-columns:72px 1fr}.side{padding:18px 10px}.brand{padding:0;justify-content:center}.brand>div:last-child,.nav .label,.sidefoot{display:none}.nav button{justify-content:center;padding:12px 8px;font-size:0}.nav button.active:before{display:none}.nav .ico{font-size:17px}.content{padding:24px 18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.top{padding:0 16px;height:62px}.content{padding:20px 13px}.heading{flex-direction:column}.cards{gap:8px}.card{padding:13px}.metric{font-size:23px}.grid2{grid-template-columns:1fr}.table th,.table td{padding:9px 6px}.hide-mobile{display:none}}
@media print{.side,.top,.heading .btn,.no-print{display:none!important}.app{display:block}.content{padding:0}.sheet{margin:0;max-width:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><div class="mark">E</div><div><strong>CGL+ ExamKit</strong><small>Paper · OMR · Grading</small></div></div>
<nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span><span class="label">Overview</span></button>
<button data-page="papers"><span class="ico">▤</span><span class="label">My Papers</span></button>
<button data-page="editor"><span class="ico">✎</span><span class="label">Question Editor</span></button>
<button data-page="omr"><span class="ico">◉</span><span class="label">OMR Studio</span></button>
<button data-page="students"><span class="ico">♙</span><span class="label">Students</span></button>
<button data-page="grades"><span class="ico">✓</span><span class="label">Grade Checker</span></button>
<button data-page="analytics"><span class="ico">▥</span><span class="label">Analytics</span></button>
<button data-page="files"><span class="ico">▣</span><span class="label">File Manager</span></button>
<button data-page="settings"><span class="ico">⚙</span><span class="label">Settings</span></button>
</nav><div class="sidefoot">CGL+ Education<br>ExamKit · First build</div>
</aside>
<main class="main"><header class="top"><div class="crumb">Workspace / <b id="crumb">Overview</b></div><div class="topright"><span class="muted" id="today"></span><div class="avatar">N</div></div></header><div class="content" id="view"></div></main>
</div><div id="toast" class="toast hidden"></div>
<script>
const KEY="cgl.examkit.workspace.v1";
const blank=()=>({version:1,settings:{school:"",teacher:"",theme:"dark"},papers:[],students:[],results:[],files:[]});
let db=load(),page="dashboard",editingPaper=null;
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify("Storage is full or unavailable.");return false}}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function notify(s){let t=document.getElementById("toast");t.textContent=s;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2600)}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function go(p){page=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("crumb").textContent=({dashboard:"Overview",papers:"My Papers",editor:"Question Editor",omr:"OMR Studio",students:"Students",grades:"Grade Checker",analytics:"Analytics",files:"File Manager",settings:"Settings"})[p];render()}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("today").textContent=new Intl.DateTimeFormat(undefined,{dateStyle:"medium"}).format(new Date());
const view=document.getElementById("view");
function heading(title,sub,action=""){return '<div class="heading"><div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'+action+'</div>'}
function btn(text,act,primary=false){return '<button class="btn '+(primary?"primary":"")+'" data-action="'+act+'">'+text+'</button>'}
function render(){({dashboard:dashboard,papers:papers,editor:editor,omr:omr,students:students,grades:grades,analytics:analytics,files:files,settings:settings}[page]||dashboard)()}
function dashboard(){let q=db.papers.reduce((n,p)=>n+p.questions.length,0),avg=db.results.length?Math.round(db.results.reduce((n,r)=>n+r.percent,0)/db.results.length):0;view.innerHTML=heading("Good day. Ready to assess?","Your examination workspace at a glance.",btn("+ New paper","new-paper",true))+ '<div class="cards"><div class="card"><span class="muted">Papers</span><div class="metric">'+db.papers.length+'</div></div><div class="card"><span class="muted">Questions</span><div class="metric">'+q+'</div></div><div class="card"><span class="muted">Students</span><div class="metric">'+db.students.length+'</div></div><div class="card"><span class="muted">Average score</span><div class="metric">'+avg+'%</div></div></div><div class="grid2"><section class="panel"><div class="row"><h2 class="section-title">Recent papers</h2>'+btn("View all","papers")+'</div>'+paperTable(db.papers.slice(-5).reverse())+'</section><section class="panel"><h2 class="section-title">Quick actions</h2><div class="stack">'+btn("Create an examination paper","new-paper",true)+btn("Add a student","add-student")+btn("Open OMR Studio","omr")+btn("Create a .cgl backup","backup")+'</div></section></div>'}
function paperTable(arr){if(!arr.length)return '<div class="empty">No papers yet. Create your first paper to get started.</div>';return '<table class="table"><thead><tr><th>Paper</th><th>Questions</th><th class="hide-mobile">Updated</th><th></th></tr></thead><tbody>'+arr.map(p=>'<tr><td><b>'+esc(p.title)+'</b><br><span class="muted">'+esc(p.subject||"Uncategorised")+'</span></td><td>'+p.questions.length+'</td><td class="hide-mobile">'+new Date(p.updated).toLocaleDateString()+'</td><td><button class="btn" data-action="edit-paper" data-id="'+p.id+'">Open</button></td></tr>').join("")+'</tbody></table>'}
function papers(){view.innerHTML=heading("My Papers","Create and manage question papers.",btn("+ Create paper","new-paper",true))+'<section class="panel">'+paperTable([...db.papers].reverse())+'</section>'}
function editor(){let p=db.papers.find(x=>x.id===editingPaper);view.innerHTML=heading("Question Editor","Build an exam and maintain its answer key.",btn("My Papers","papers"))+'<section class="panel"><div class="grid2"><div class="field"><label>Paper title</label><input id="ptitle" placeholder="e.g. Science — Unit Test 1" value="'+esc(p?.title||"")+'"></div><div class="field"><label>Subject</label><input id="psubject" placeholder="Subject" value="'+esc(p?.subject||"")+'"></div></div><div class="grid2"><div class="field"><label>Duration (minutes)</label><input id="pduration" type="number" min="1" value="'+(p?.duration||60)+'"></div><div class="field"><label>Marks per question</label><input id="pmarks" type="number" min="1" value="'+(p?.marks||1)+'"></div></div><div class="row"><h2 class="section-title">Questions</h2>'+btn("+ Add MCQ","add-question")+'</div><div id="questions">'+(p?.questions||[]).map((q,i)=>questionHTML(q,i)).join("")+'</div><div class="row"><span class="muted" id="qcount">'+(p?.questions.length||0)+' questions</span><div class="actions">'+btn("Save paper","save-paper",true)+'</div></div></section>'}
function questionHTML(q,i){return '<div class="question" data-qid="'+q.id+'"><div class="row"><b>Question '+(i+1)+'</b><button class="btn danger" data-action="remove-question" data-id="'+q.id+'">Remove</button></div><div class="field"><label>Question text</label><textarea class="qtext">'+esc(q.text)+'</textarea></div><div class="grid2">'+q.options.map((o,j)=>'<div class="option"><input type="radio" name="correct-'+q.id+'" value="'+j+'" '+(q.answer===j?"checked":"")+'><input class="qopt" data-index="'+j+'" value="'+esc(o)+'" aria-label="Option '+(j+1)+'"></div>').join("")+'</div><small class="muted">Select the radio button beside the correct answer.</small></div>'}
function omr(){let p=db.papers[0];view.innerHTML=heading("OMR Studio","Prepare printable answer sheets and organise scan sessions.")+'<section class="panel"><h2 class="section-title">Answer sheet generator</h2><p class="muted">Choose a saved paper to generate a numbered response sheet. Print at 100% scale on A4 paper.</p><div class="field"><label>Paper</label><select id="omrpaper">'+db.papers.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join("")+'</select></div><div class="field"><label>Student name (optional)</label><input id="omrstudent" placeholder="Student name"></div><div class="actions">'+btn("Generate & print sheet","print-sheet",true)+'</div></section><section class="panel"><h2 class="section-title">Scan & evaluate</h2><p>Image-based bubble recognition is not enabled in this first build. You can record answers manually in Grade Checker; scan calibration, perspective correction and automatic multi-mark detection are planned for the OMR engine.</p><span class="pill">Manual grading available</span></section><div id="printarea"></div>'}
function students(){view.innerHTML=heading("Student Manager","Maintain your class list.",btn("+ Add student","add-student",true))+'<section class="panel">'+(db.students.length?'<table class="table"><thead><tr><th>Name</th><th>Student ID</th><th>Class</th><th></th></tr></thead><tbody>'+db.students.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.code||"—")+'</td><td>'+esc(s.className||"—")+'</td><td><button class="btn danger" data-action="delete-student" data-id="'+s.id+'">Delete</button></td></tr>').join("")+'</tbody></table>':'<div class="empty">No students added yet.</div>')+'</section>'}
function grades(){view.innerHTML=heading("Grade Checker","Enter scores and maintain assessment records.",btn("+ Record result","add-result",true))+'<section class="panel">'+(db.results.length?'<table class="table"><thead><tr><th>Student</th><th>Paper</th><th>Score</th><th>Percentage</th></tr></thead><tbody>'+db.results.slice().reverse().map(r=>'<tr><td>'+esc(db.students.find(s=>s.id===r.studentId)?.name||"Unknown student")+'</td><td>'+esc(db.papers.find(p=>p.id===r.paperId)?.title||"Deleted paper")+'</td><td>'+r.score+'/'+r.total+'</td><td>'+r.percent+'%</td></tr>').join("")+'</tbody></table>':'<div class="empty">No grades recorded. Add students and papers, then record a result.</div>')+'</section>'}
function analytics(){let avg=db.results.length?Math.round(db.results.reduce((a,r)=>a+r.percent,0)/db.results.length):0,pass=db.results.filter(r=>r.percent>=40).length;view.innerHTML=heading("Analytics","A simple summary of recorded assessment results.")+'<div class="cards"><div class="card"><span class="muted">Assessments graded</span><div class="metric">'+db.results.length+'</div></div><div class="card"><span class="muted">Average percentage</span><div class="metric">'+avg+'%</div></div><div class="card"><span class="muted">At or above 40%</span><div class="metric">'+pass+'</div></div><div class="card"><span class="muted">Below 40%</span><div class="metric">'+(db.results.length-pass)+'</div></div></div><section class="panel"><h2 class="section-title">Score distribution</h2>'+[["80–100%",80],["60–79%",60],["40–59%",40],["0–39%",0]].map(([l,n])=>{let count=db.results.filter(r=>r.percent>=n&&(n===80||r.percent<(n===60?80:n===40?60:40))).length;return '<p>'+l+' <b style="float:right">'+count+'</b></p><div style="height:8px;background:#30343d;border-radius:8px;overflow:hidden"><div style="height:100%;width:'+(db.results.length?count/db.results.length*100:0)+'%;background:var(--yellow)"></div></div>'}).join("")+'</section>'}
function files(){view.innerHTML=heading("File Manager","Manage ExamKit workspace data and backups.",btn("Export .cgl backup","backup",true))+'<section class="panel"><h2 class="section-title">Workspace contents</h2><table class="table"><tbody><tr><td>Examination papers</td><td>'+db.papers.length+'</td></tr><tr><td>Students</td><td>'+db.students.length+'</td></tr><tr><td>Graded results</td><td>'+db.results.length+'</td></tr><tr><td>Custom files</td><td>'+db.files.length+'</td></tr></tbody></table><div class="field" style="margin-top:18px"><label>Restore a .cgl backup</label><input id="restorefile" type="file" accept=".cgl,application/json"></div>'+btn("Restore selected backup","restore")+'</section><section class="panel"><h2 class="section-title">Data portability</h2><p class="muted">Your workspace is currently stored in this browser on this device. Export backups regularly before clearing browser data.</p></section>'}
function settings(){view.innerHTML=heading("Settings","Workspace preferences and backup controls.")+'<section class="panel"><div class="field"><label>School / organisation</label><input id="school" value="'+esc(db.settings.school)+'" placeholder="School name"></div><div class="field"><label>Teacher / examiner</label><input id="teacher" value="'+esc(db.settings.teacher)+'" placeholder="Name"></div>'+btn("Save settings","save-settings",true)+'</section><section class="panel"><h2 class="section-title">Backup & restore</h2><p class="muted">Export a versioned .cgl workspace backup with an integrity digest. Import verifies the digest before replacing local data.</p><div class="actions">'+btn("Export .cgl backup","backup",true)+'<label class="btn">Choose backup<input id="settingsrestore" type="file" accept=".cgl,application/json" hidden></label></div></section><section class="panel"><h2 class="section-title">About ExamKit</h2><p>CGL+ ExamKit · Early access build 0.1.0</p><p class="muted">Paper authoring and local grade management foundation. OMR image recognition and OCR are not yet implemented.</p></section>'}
function addQuestion(){let p=db.papers.find(x=>x.id===editingPaper);let el=document.createElement("div");el.innerHTML=questionHTML({id:id(),text:"",options:["Option A","Option B","Option C","Option D"],answer:0},document.querySelectorAll(".question").length);document.getElementById("questions").append(el.firstElementChild)}
function savePaper(){let title=document.getElementById("ptitle").value.trim();if(!title)return notify("Enter a paper title first.");let questions=[...document.querySelectorAll(".question")].map(el=>({id:el.dataset.qid,text:el.querySelector(".qtext").value.trim(),options:[...el.querySelectorAll(".qopt")].map(x=>x.value.trim()),answer:Number(el.querySelector('input[type=radio]:checked')?.value??0)}));if(questions.some(q=>!q.text||q.options.some(o=>!o)))return notify("Complete every question and option.");let p=db.papers.find(x=>x.id===editingPaper);let item={id:p?.id||id(),title,subject:document.getElementById("psubject").value.trim(),duration:Number(document.getElementById("pduration").value)||60,marks:Number(document.getElementById("pmarks").value)||1,questions,updated:new Date().toISOString()};if(p)Object.assign(p,item);else db.papers.push(item);save();editingPaper=item.id;notify("Paper saved.");go("papers")}
function createPaper(){editingPaper=null;go("editor")}
function printSheet(){let p=db.papers.find(x=>x.id===document.getElementById("omrpaper").value);if(!p)return notify("Create a paper first.");let name=document.getElementById("omrstudent").value;let a=document.getElementById("printarea");a.innerHTML='<div class="sheet"><h2>'+esc(p.title)+'</h2><p>Student: '+esc(name||"________________________")+'　　Date: ______________</p><p>Instructions: Fill one bubble for each question using a dark pen.</p><hr>'+p.questions.map((q,i)=>'<p><b>'+(i+1)+'.</b>　'+["A","B","C","D"].map(x=>x+' <span class="bubble"></span>').join("　")+'</p>').join("")+'</div>';setTimeout(()=>window.print(),100)}
function addStudent(){let name=prompt("Student full name:");if(!name?.trim())return;let code=prompt("Student ID (optional):")||"";let className=prompt("Class / section (optional):")||"";db.students.push({id:id(),name:name.trim(),code:code.trim(),className:className.trim()});save();render()}
function addResult(){if(!db.students.length||!db.papers.length)return notify("Add at least one student and one paper first.");let studentId=prompt("Enter student number from Student Manager (first student = 1):");let student=db.students[Number(studentId)-1];if(!student)return notify("Student not found.");let paperId=prompt("Enter paper number from My Papers (first paper = 1):");let paper=db.papers[Number(paperId)-1];if(!paper)return notify("Paper not found.");let score=Number(prompt("Score achieved (maximum "+(paper.questions.length*paper.marks)+"):"));let total=paper.questions.length*paper.marks;if(!Number.isFinite(score)||score<0||score>total)return notify("Enter a valid score.");db.results.push({id:id(),studentId:student.id,paperId:paper.id,score,total,percent:Math.round(score/total*100),created:new Date().toISOString()});save();render()}
async function digest(str){if(!crypto?.subtle)throw new Error("SHA-256 requires a secure browser context (HTTPS).");let hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function backup(){let payload={format:"CGL+",product:"ExamKit",schemaVersion:1,createdAt:new Date().toISOString(),workspace:db};let canonical=JSON.stringify(payload);let envelope={...payload,integrity:{algorithm:"SHA-256",digest:await digest(canonical)}};let blob=new Blob([JSON.stringify(envelope,null,2)],{type:"application/vnd.cgl.examkit+json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ExamKit-backup-"+new Date().toISOString().slice(0,10)+".cgl";a.click();URL.revokeObjectURL(a.href);notify("Backup exported.")}
async function restore(file){if(!file)return notify("Choose a .cgl file.");try{let data=JSON.parse(await file.text());if(data.format!=="CGL+"||data.product!=="ExamKit"||data.schemaVersion!==1||!data.workspace||!data.integrity)throw Error("This is not a supported ExamKit backup.");let expected=await digest(JSON.stringify({format:data.format,product:data.product,schemaVersion:data.schemaVersion,createdAt:data.createdAt,workspace:data.workspace}));if(expected!==data.integrity.digest)throw Error("Integrity check failed. Backup was not restored.");if(!confirm("Restore this backup? It will replace the current ExamKit workspace."))return;db={...blank(),...data.workspace};save();notify("Backup restored.");go("dashboard")}catch(e){notify(e.message||"Could not restore backup.")}}
document.addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(!b)return;let a=b.dataset.action; if(a==="new-paper")createPaper();if(a==="papers")go("papers");if(a==="edit-paper"){editingPaper=b.dataset.id;go("editor")}if(a==="add-question")addQuestion();if(a==="remove-question")b.closest(".question").remove();if(a==="save-paper")savePaper();if(a==="print-sheet")printSheet();if(a==="add-student")addStudent();if(a==="delete-student"){if(confirm("Delete this student?")){db.students=db.students.filter(s=>s.id!==b.dataset.id);save();render()}}if(a==="add-result")addResult();if(a==="backup")backup().catch(err=>notify(err.message));if(a==="restore")restore(document.getElementById("restorefile").files[0]);if(a==="save-settings"){db.settings.school=document.getElementById("school").value;db.settings.teacher=document.getElementById("teacher").value;save();notify("Settings saved.")}});
document.addEventListener("change",e=>{if(e.target.id==="settingsrestore")restore(e.target.files[0])});
render();
</script></body></html>
